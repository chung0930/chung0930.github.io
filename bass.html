<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業低音增強與無損直出渲染器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0d0e15, #1a1c29);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app-card {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h3 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }
        .drop-zone {
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            background: rgba(56, 189, 248, 0.02);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .drop-zone:hover {
            background: rgba(56, 189, 248, 0.08);
        }
        .meta-box {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .album-art {
            width: 80px;
            height: 80px;
            background: #334155;
            border-radius: 8px;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .meta-info input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 10px;
            color: #fff;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 0.85rem;
            outline: none;
        }
        .slider-wrap {
            margin-bottom: 20px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #94a3b8;
        }
        .slider-header span:last-child {
            color: #38bdf8;
            font-weight: 600;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 4px;
            -webkit-appearance: none;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.95rem;
        }
        .btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1e293b;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #10b981;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

<div class="app-card">
    <h3>BASS ENGINE PRO</h3>
    
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('audioFile').click()">
        <p id="promptText">選擇或拖放音訊原始檔案 (MP3/WAV)</p>
        <input type="file" id="audioFile" accept="audio/*" style="display:none">
    </div>

    <div class="meta-box">
        <div class="album-art" id="coverPreview">無封面</div>
        <div class="meta-info">
            <label style="font-size:0.75rem; color:#64748b;">輸出歌名 (Title)</label>
            <input type="text" id="metaTitle" placeholder="未知歌曲">
        </div>
    </div>

    <div class="slider-wrap">
        <div class="slider-header">
            <span>低音引擎增益 (Bass Gain)</span>
            <span id="bassVal">0 dB</span>
        </div>
        <input type="range" id="bassSlider" min="0" max="18" step="0.5" value="0">
    </div>

    <div class="slider-wrap">
        <div class="slider-header">
            <span>動態餘裕安全閥 (Headroom)</span>
            <span id="ceilingVal">-1.0 dB</span>
        </div>
        <input type="range" id="ceilingSlider" min="-3.0" max="-0.2" step="0.1" value="-1.0">
    </div>

    <button class="btn" id="renderBtn" disabled>開始無損直出渲染並下載</button>
    
    <div class="progress-bar" id="progressContainer">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<script>
// 由於瀏覽器原生環境讀取 ID3 Tag 較為複雜，此處採用精確的 ArrayBuffer 暴力比對及解碼機制獲取封面與後設資料
let sourceBuffer = null;
let currentFile = null;
let albumArtBlob = null;

const audioFileInput = document.getElementById('audioFile');
const dropZone = document.getElementById('dropZone');
const promptText = document.getElementById('promptText');
const metaTitle = document.getElementById('metaTitle');
const coverPreview = document.getElementById('coverPreview');
const bassSlider = document.getElementById('bassSlider');
const bassVal = document.getElementById('bassVal');
const ceilingSlider = document.getElementById('ceilingSlider');
const ceilingVal = document.getElementById('ceilingVal');
const renderBtn = document.getElementById('renderBtn');
const progressContainer = document.getElementById('progressContainer');
const progressFill = document.getElementById('progressFill');

// 滑桿事件即時更新數值
bassSlider.addEventListener('input', (e) => bassVal.textContent = e.target.value + ' dB');
ceilingSlider.addEventListener('input', (e) => ceilingVal.textContent = e.target.value + ' dB');

// 監聽檔案載入
audioFileInput.addEventListener('change', handleFileSelect);

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    currentFile = file;
    promptText.textContent = file.name;
    metaTitle.value = file.name.replace(/\.[^/.]+$/, ""); // 預設使用檔名當作歌名
    
    renderBtn.disabled = true;
    renderBtn.textContent = "正在讀取音訊結構...";

    const reader = new FileReader();
    reader.onload = function(evt) {
        const arrayBuffer = evt.target.result;
        
        // 嘗試提取內嵌 ID3v2 圖片 (APIC 標籤)
        extractID3Cover(arrayBuffer);

        // 進行 Web Audio 解碼
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.decodeAudioData(arrayBuffer.slice(0))
            .then(buffer => {
                sourceBuffer = buffer;
                renderBtn.disabled = false;
                renderBtn.textContent = "開始無損直出渲染並下載";
            })
            .catch(err => {
                alert("音訊解碼失敗，請確保檔案格式無損或無毀損。");
                renderBtn.textContent = "檔案解析錯誤";
            });
    };
    reader.readAsArrayBuffer(file);
}

// 快速精確解析 ID3 專輯封面封包格式
function extractID3Cover(buffer) {
    const view = new DataView(buffer);
    if (view.byteLength > 10 && view.getUint8(0) === 0x49 && view.getUint8(1) === 0x44 && view.getUint8(2) === 0x33) { // 檢查是否為 ID3
        let offset = 10;
        const totalSize = readID3Size(view, 6);
        
        while (offset < totalSize) {
            if (offset + 10 > buffer.byteLength) break;
            const frameID = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
            const frameSize = readID3Size(view, offset + 4);
            
            if (frameID === "APIC") { // 找到封面的 Frame
                let p = offset + 10;
                const textEncoding = view.getUint8(p); p++;
                
                // 跳過 mime type
                let mimeType = "";
                while (p < buffer.byteLength) {
                    const v = view.getUint8(p); p++;
                    if (v === 0) break;
                    mimeType += String.fromCharCode(v);
                }
                
                const pictureType = view.getUint8(p); p++;
                
                // 跳過 description
                while (p < buffer.byteLength) {
                    const v = view.getUint8(p); p++;
                    if (v === 0) break; 
                }
                
                const imgData = buffer.slice(p, offset + 10 + frameSize);
                albumArtBlob = new Blob([imgData], { type: mimeType || "image/jpeg" });
                
                // 更新預覽 UI
                coverPreview.style.background = `url(${URL.createObjectURL(albumArtBlob)}) center/cover no-repeat`;
                coverPreview.textContent = "";
                return;
            }
            offset += 10 + frameSize;
        }
    }
    // 找不到就重置為空
    albumArtBlob = null;
    coverPreview.style.background = "#334155";
    coverPreview.textContent = "無封面";
}

function readID3Size(view, offset) {
    return (view.getUint8(offset) << 21) | (view.getUint8(offset+1) << 14) | (view.getUint8(offset+2) << 7) | view.getUint8(offset+3);
}

// 執行核心離線渲染（Offline Rendering）演算法
renderBtn.addEventListener('click', async () => {
    if (!sourceBuffer) return;

    renderBtn.disabled = true;
    progressContainer.style.display = "block";
    progressFill.style.width = "0%";

    const targetGain = parseFloat(bassSlider.value);
    const targetCeiling = parseFloat(ceilingSlider.value);

    // 建立離線音訊環境 (維持原檔案的聲道數與取樣率直出)
    const offlineCtx = new OfflineAudioContext(
        sourceBuffer.numberOfChannels,
        sourceBuffer.length,
        sourceBuffer.sampleRate
    );

    // 建立硬體重建鏈
    const bufferSource = offlineCtx.createBufferSource();
    bufferSource.buffer = sourceBuffer;

    // 低音等化器 (低架濾波器)
    const lowShelf = offlineCtx.createBiquadFilter();
    lowShelf.type = "lowshelf";
    lowShelf.frequency.value = 135; // 精確鎖定極低音域
    lowShelf.gain.value = targetGain;

    // 數位磚牆安全閥 (防止超載破音的靈魂節點)
    const limiter = offlineCtx.createDynamicsCompressor();
    limiter.threshold.value = targetCeiling; // 絕對天花板限制
    limiter.knee.value = 0.0;                 // 0表示硬天花板限制 (Hard Limiting)
    limiter.ratio.value = 20.0;               // 無限比極大化壓縮
    limiter.attack.value = 0.001;             // 1ms 反應速度
    limiter.release.value = 0.05;             // 快釋放，保證動態不失真

    // 節點鏈結
    bufferSource.connect(lowShelf);
    lowShelf.connect(limiter);
    limiter.connect(offlineCtx.destination);

    // 啟動音軌渲染
    bufferSource.start(0);

    // 模擬進度條
    const progressInterval = setInterval(() => {
        if (progressFill.style.width === "95%") return;
        let cur = parseInt(progressFill.style.width) || 0;
        progressFill.style.width = (cur + 5) + "%";
    }, 100);

    const renderedBuffer = await offlineCtx.startRendering();
    clearInterval(progressInterval);
    progressFill.style.width = "100%";

    // 將完成的無損 Buffer 轉為 WAV 檔案 (因為 WAV 檔案可以無損完美保留重新計算後的浮點數)
    const wavBlob = bufferToWav(renderedBuffer);
    
    // 輸出下載
    const outputName = metaTitle.value ? metaTitle.value + "_BassBoosted.wav" : "output_bass.wav";
    const downloadLink = document.createElement('a');
    downloadLink.href = URL.createObjectURL(wavBlob);
    downloadLink.download = outputName;
    downloadLink.click();

    // 恢復狀態
    setTimeout(() => {
        renderBtn.disabled = false;
        progressContainer.style.display = "none";
    }, 1000);
});

// 無損音訊 Buffer 轉換為標準直出 WAV 容器二進位格式演算法
function bufferToWav(buffer) {
    const numOfChan = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1; // 1 代表未壓縮的 PCM
    const bitDepth = 16;
    
    let result;
    if (numOfChan === 2) {
        result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
    } else {
        result = buffer.getChannelData(0);
    }
    
    const bufferLen = result.length * 2;
    const ab = new ArrayBuffer(44 + bufferLen);
    const view = new DataView(ab);
    
    /* RIFF identifier */
    writeString(view, 0, 'RIFF');
    /* file length */
    view.setUint32(4, 36 + bufferLen, true);
    /* RIFF type */
    writeString(view, 8, 'WAVE');
    /* format chunk identifier */
    writeString(view, 12, 'fmt ');
    /* format chunk length */
    view.setUint32(16, 16, true);
    /* sample format (raw) */
    view.setUint16(20, format, true);
    /* channel count */
    view.setUint16(22, numOfChan, true);
    /* sample rate */
    view.setUint32(24, sampleRate, true);
    /* byte rate (sample rate * block align) */
    view.setUint32(28, sampleRate * numOfChan * (bitDepth / 8), true);
    /* block align (channel count * bytes per sample) */
    view.setUint16(32, numOfChan * (bitDepth / 8), true);
    /* bits per sample */
    view.setUint16(34, bitDepth, true);
    /* data chunk identifier */
    writeString(view, 36, 'data');
    /* data chunk length */
    view.setUint32(40, bufferLen, true);
    
    // 寫入 PCM 數據並進行限幅保護
    floatTo16BitPCM(view, 44, result);
    
    return new Blob([view], { type: 'audio/wav' });
}

function interleave(inputL, inputR) {
    const length = inputL.length + inputR.length;
    const result = new Float32Array(length);
    let index = 0;
    let inputIndex = 0;
    while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
    }
    return result;
}

function floatTo16BitPCM(output, offset, input) {
    for (let i = 0; i < input.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, input[i])); // 再度限制絕對峰值
        output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
}

function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
    }
}
</script>

</body>
</html>
