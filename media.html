<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豬皮專業影音控制端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #475569;
            height: 8px;
            border-radius: 9999px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-black text-blue-500 tracking-wide">專業媒體中控台</h1>
            <p class="text-xs text-slate-400 mt-1">獨立控制 Port 3002 顯示端狀態</p>
            <div id="connStatus" class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> 連線中斷
            </div>
        </header>

        <div class="space-y-6">
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4">
                <h3 class="text-sm font-bold text-slate-300 mb-3">🎬 影片播放控制器</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="sendCmd('PLAY')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-blue-950/50 active:scale-95">
                        ▶ 開始播放
                    </button>
                    <button onclick="sendCmd('PAUSE')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl transition-all active:scale-95">
                        ⏸ 暫停播放
                    </button>
                </div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4">
                <h3 class="text-sm font-bold text-slate-300 mb-3">👁️ 看板顯示狀態</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="sendCmd('SHOW_DISPLAY')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-emerald-950/50 active:scale-95">
                        顯示畫面
                    </button>
                    <button onclick="sendCmd('HIDE_DISPLAY')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-rose-950/50 active:scale-95">
                        暫停顯示 (黑屏)
                    </button>
                </div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4">
                <h3 class="text-sm font-bold text-slate-300 mb-3">🔊 音訊與音量進階管理</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="sendCmd('MUTE')" class="bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold py-2.5 px-4 rounded-xl transition-all active:scale-95">
                        🔇 靜音
                    </button>
                    <button onclick="sendCmd('UNMUTE')" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 font-bold py-2.5 px-4 rounded-xl transition-all active:scale-95">
                        🔊 解除靜音
                    </button>
                </div>
                <div class="pt-2">
                    <div class="flex justify-between text-xs text-slate-400 mb-1.5">
                        <span>遠端音量調節</span>
                        <span id="volVal" class="text-blue-400 font-bold">100%</span>
                    </div>
                    <input type="range" id="volumeSlider" min="0" max="100" value="100" class="w-full">
                </div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4">
                <h3 class="text-sm font-bold text-slate-300 mb-3">🔒 顯示端前端權限鎖定</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-2 rounded-xl bg-slate-900/50 border border-slate-800 cursor-pointer">
                        <span class="text-xs font-medium text-slate-300">🚫 不允許前端使用者自行靜音</span>
                        <input type="checkbox" id="lockMute" class="w-4 h-4 text-blue-600 bg-slate-800 border-slate-700 rounded focus:ring-blue-500">
                    </label>
                    <label class="flex items-center justify-between p-2 rounded-xl bg-slate-900/50 border border-slate-800 cursor-pointer">
                        <span class="text-xs font-medium text-slate-300">🚫 鎖定全螢幕 (禁止退出看板模式)</span>
                        <input type="checkbox" id="lockFullscreen" class="w-4 h-4 text-blue-600 bg-slate-800 border-slate-700 rounded focus:ring-blue-500">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        const connStatus = document.getElementById('connStatus');
        const volumeSlider = document.getElementById('volumeSlider');
        const volVal = document.getElementById('volVal');
        const lockMute = document.getElementById('lockMute');
        const lockFullscreen = document.getElementById('lockFullscreen');

        function connect() {
            // 自動偵測當前主機 IP，連線至獨立的控制通訊埠 3005
            ws = new WebSocket('ws://' + window.location.hostname + ':3005');

            ws.onopen = () => {
                connStatus.className = "mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                connStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 中控連線正常';
                // 同步當前的鎖定狀態
                syncLockState();
            };

            ws.onclose = () => {
                connStatus.className = "mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                connStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> 連線中斷，正在重連...';
                setTimeout(connect, 2000);
            };
        }

        function sendCmd(action, value = null) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: action, value: value }));
            }
        }

        // 音量即時滑動控制
        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volVal.textContent = val + '%';
            sendCmd('SET_VOLUME', val / 100);
        });

        // 鎖定設定變更
        function syncLockState() {
            sendCmd('SET_LOCKS', {
                disableClientMute: lockMute.checked,
                forceFullscreen: lockFullscreen.checked
            });
        }

        lockMute.addEventListener('change', syncLockState);
        lockFullscreen.addEventListener('change', syncLockState);

        window.onload = connect;
    </script>
</body>
</html>
