<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿名收件匣</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .message-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #ff007b;
        }
        .time {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .content {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📥 匿名收件匣</h1>
    <div id="messagesContainer">
        <div class="loading">載入訊息中...</div>
    </div>
</div>

<script>
    // ！！！請將下方的 URL 換成你的 Apps Script Web App URL ！！！
    const API_URL = "https://script.google.com/macros/s/AKfycbxvvyhZOxMXgR0TWD1pKMO9Lg27rBrt7eRwjlnk_oJEGAMZmEZlq24XDacIJImJdc0jag/exec";

    function loadMessages() {
        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = ''; // 清空載入文字

            if (data.success) {
                if (data.data.length === 0) {
                    container.innerHTML = '<div class="loading">目前還沒有任何訊息喔！</div>';
                    return;
                }

                data.data.forEach(item => {
                    const date = new Date(item.timestamp);
                    const timeString = date.toLocaleString('zh-TW');
                    
                    const card = document.createElement('div');
                    card.className = 'message-card';
                    card.innerHTML = `
                        <div class="time">${timeString}</div>
                        <div class="content">${item.message.replace(/\n/g, '<br>')}</div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `<div class="loading">❌ 載入失敗：${data.error}</div>`;
            }
        })
        .catch(error => {
            document.getElementById('messagesContainer').innerHTML = `<div class="loading">❌ 發生錯誤：${error}</div>`;
        });
    }

    // 頁面載入時執行
    loadMessages();
</script>

</body>
</html>
