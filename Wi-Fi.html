<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi 自動連線</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            width: 90%;
            max-width: 400px;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
        }
        .wifi-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .wifi-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>正在嘗試連線 Wi-Fi...</h2>
        <p>如果沒有自動跳轉，請點擊下方按鈕：</p>
        
        <a id="wifiLink" class="wifi-btn" href="#">手動連線 Wi-Fi</a>
    </div>

    <script>
        const ssid = "HITRON-A560-5G";
        const password = "chung0930";
        const encryption = "WPA";

        const wifiString = `WIFI:S:${ssid};T:${encryption};P:${password};;`;
        
        const wifiLinkElement = document.getElementById("wifiLink");
        wifiLinkElement.href = wifiString;

        window.location.href = wifiString;
    </script>

</body>
</html>
